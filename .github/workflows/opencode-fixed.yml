name: 🤖 OpenCode AI Cloud (Web) — Fixed Sessions Detection

# يعمل هذا الـ workflow على أي repository تضع فيه هذا الملف
# المسار المطلوب: .github/workflows/opencode.yml

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "كم دقيقة يبقى السيرفر شغّال (الحد الأقصى 350)"
        required: true
        default: "350"
        type: string
      auto_commit:
        description: "commit + push تلقائي؟"
        required: true
        default: true
        type: boolean
      commit_interval_seconds:
        description: "كل كم ثانية يتم فحص التغييرات"
        required: true
        default: "60"
        type: string

permissions:
  contents: write

jobs:
  opencode-web:
    name: 🚀 Run OpenCode Web + Cloudflare Tunnel
    runs-on: ubuntu-latest
    timeout-minutes: 355

    env:
      OPENCODE_API_KEY:    ${{ secrets.OPENCODE_API_KEY }}
      ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
      DEEPSEEK_API_KEY:    ${{ secrets.DEEPSEEK_API_KEY }}
      MISTRAL_API_KEY:     ${{ secrets.MISTRAL_API_KEY }}
      XAI_API_KEY:         ${{ secrets.XAI_API_KEY }}
      COHERE_API_KEY:      ${{ secrets.COHERE_API_KEY }}
      TOGETHER_API_KEY:    ${{ secrets.TOGETHER_API_KEY }}
      PERPLEXITY_API_KEY:  ${{ secrets.PERPLEXITY_API_KEY }}

    steps:
      # =======================================================================
      # 1) Checkout — مع fetch-depth: 0 لضمان استقرار project_id
      # =======================================================================
      - name: 📥 Checkout repository (full history for stable project_id)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # ⭐ ضروري: opencode يستخدم root commit hash
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      # =======================================================================
      # 2) Node.js
      # =======================================================================
      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # =======================================================================
      # 3) System deps
      # =======================================================================
      - name: 🛠️ Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip jq git ca-certificates procps sqlite3

      # =======================================================================
      # 4) ⭐ الإصلاح الحاسم #1: تأكيد أن git يرى الـ repo وأن root commit موجود
      # =======================================================================
      - name: 🔧 Verify git state (critical for project_id stability)
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          echo "===== Git state verification ====="
          echo "PWD: $(pwd)"
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          
          # التأكد من أن المجلد Git repo فعلاً
          git rev-parse --is-inside-work-tree
          
          # ⭐ حساب root commit hash — هذا هو ما يستخدمه opencode كـ project_id
          ROOT_COMMIT=$(git rev-list --max-parents=0 HEAD | head -n1)
          echo "🔑 Root commit (opencode project_id) = $ROOT_COMMIT"
          echo "OPENCODE_PROJECT_ID=$ROOT_COMMIT" >> "$GITHUB_ENV"
          
          # عرض الملفات والمجلدات لتأكيد أنها موجودة
          echo "===== Repository contents ====="
          ls -la
          echo "===== Directories only ====="
          find . -maxdepth 2 -type d -not -path './.git*' | head -30

      # =======================================================================
      # 5) تثبيت OpenCode
      # =======================================================================
      - name: 🤖 Install OpenCode AI (official installer)
        run: |
          set -e
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.opencode/bin:$PATH"
          npm install -g opencode-ai || true
          which opencode
          opencode --version

      - name: ☁️ Install cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      # =======================================================================
      # 6) ⭐ الإصلاح الحاسم #2: إنشاء opencode.json داخل الـ repo مباشرة
      #     + تفعيل خيارات لضمان اكتشاف الجلسات والمجلدات
      # =======================================================================
      - name: 📝 Prepare opencode config (session-aware)
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          # نُنشئ config في جذر الـ repo — opencode يبحث عنه صعوداً من cwd
          if [ ! -f "opencode.json" ] && [ ! -f ".opencode/opencode.json" ]; then
            cat > opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "theme": "opencode",
            "autoshare": false,
            "autoupdate": false,
            "share": "manual",
            "experimental": {
              "showAllSessions": true
            }
          }
          JSON
            echo "✅ Created opencode.json in $(pwd)"
          fi
          cat opencode.json || cat .opencode/opencode.json

      # =======================================================================
      # 7) ⭐⭐⭐ الإصلاح الأهم: تشغيل opencode serve من داخل $GITHUB_WORKSPACE
      #      مع cd صريح داخل setsid + متغيرات البيئة الصحيحة
      # =======================================================================
      - name: 🚀 Start OpenCode web server (bound to repo directory)
        timeout-minutes: 5
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.opencode/bin:$PATH"

          mkdir -p "$RUNNER_TEMP/opencode-logs"
          LOG_FILE="$RUNNER_TEMP/opencode-logs/server.log"
          : > "$LOG_FILE"

          # ⭐ تأكد من أننا داخل الـ repo قبل التشغيل
          cd "$GITHUB_WORKSPACE"
          echo "🔍 Starting opencode serve from: $(pwd)"
          echo "🔍 Git root commit (project_id): $OPENCODE_PROJECT_ID"
          echo "🔍 Files present:"
          ls -la | head -20

          # ⭐⭐ الإصلاح الجوهري: cd $GITHUB_WORKSPACE داخل setsid
          # هذا يضمن أن opencode serve يبدأ بـ cwd = repo directory
          # وبالتالي project_id = git root commit hash الصحيح
          setsid bash -c "
            cd '$GITHUB_WORKSPACE' && \
            export HOME='$HOME' && \
            export OPENCODE_CONFIG_DIR='$GITHUB_WORKSPACE/.opencode' && \
            opencode serve \
              --hostname 0.0.0.0 \
              --port 4096 \
              --cors '*' \
              </dev/null >>'$LOG_FILE' 2>&1
          " &
          OPENCODE_PID=$!
          disown || true

          echo "$OPENCODE_PID" > "$RUNNER_TEMP/opencode.pid"
          echo "OpenCode PID = $OPENCODE_PID"

          # فحص الاستجابة
          UP=0
          for i in $(seq 1 120); do
            if curl -fsS --max-time 2 http://127.0.0.1:4096/global/health >/dev/null 2>&1; then
              UP=1; echo "✅ /global/health responded after ${i}s"; break
            fi
            if (echo > /dev/tcp/127.0.0.1/4096) >/dev/null 2>&1; then
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 2 http://127.0.0.1:4096/ || echo "000")
              if [ "$CODE" != "000" ]; then
                UP=1; echo "✅ opencode listening on :4096 (HTTP $CODE)"; break
              fi
            fi
            if ! kill -0 "$OPENCODE_PID" 2>/dev/null; then
              echo "❌ opencode exited prematurely. Logs:"
              cat "$LOG_FILE"
              exit 1
            fi
            sleep 1
          done

          if [ "$UP" -ne 1 ]; then
            echo "❌ opencode failed in 120s. Logs:"
            tail -n 200 "$LOG_FILE"
            kill -TERM "$OPENCODE_PID" 2>/dev/null || true
            exit 1
          fi

          # =====================================================================
          # ⭐ الإصلاح الحاسم #3: التحقق من أن opencode يرى الـ project الصحيح
          # =====================================================================
          echo ""
          echo "===== Verifying project detection ====="
          sleep 3
          
          # استعلام /path للتأكد أن working directory صحيح
          PATH_INFO=$(curl -s http://127.0.0.1:4096/path || echo "{}")
          echo "Server /path response: $PATH_INFO"
          
          # استعلام /project لرؤية الـ projects المكتشفة
          PROJECTS=$(curl -s http://127.0.0.1:4096/project 2>/dev/null || echo "[]")
          echo "Projects detected: $PROJECTS"
          
          # التحقق من مجلد storage
          STORAGE_DIR="$HOME/.local/share/opencode/project"
          echo "Storage contents:"
          ls -la "$STORAGE_DIR" 2>/dev/null || echo "(storage not yet created)"

          echo "----- opencode log tail -----"
          tail -n 40 "$LOG_FILE"

      # =======================================================================
      # 8) ⭐ الإصلاح الحاسم #4: ترحيل الجلسات القديمة (إن وُجدت) للـ project_id الحالي
      # =======================================================================
      - name: 🔄 Migrate stale sessions to current project_id
        continue-on-error: true
        run: |
          set +e
          DB="$HOME/.local/share/opencode/opencode.db"
          if [ ! -f "$DB" ]; then
            echo "ℹ️ No opencode.db yet — first run, nothing to migrate."
            exit 0
          fi
          
          CURRENT_ID="$OPENCODE_PROJECT_ID"
          WORKTREE="$GITHUB_WORKSPACE"
          
          echo "🔧 Current project_id: $CURRENT_ID"
          echo "🔧 Worktree: $WORKTREE"
          
          # عرض جميع المشاريع المخزّنة
          echo "===== Existing projects in DB ====="
          sqlite3 "$DB" "SELECT id, worktree FROM project;" 2>/dev/null || true
          
          # عدد الجلسات لكل project
          echo "===== Session counts per project ====="
          sqlite3 "$DB" "SELECT project_id, COUNT(*) FROM session GROUP BY project_id;" 2>/dev/null || true
          
          # ⭐ إذا وُجد مشروع قديم بنفس الـ worktree لكن ID مختلف، انقل الجلسات
          OLD_IDS=$(sqlite3 "$DB" "SELECT id FROM project WHERE worktree='$WORKTREE' AND id!='$CURRENT_ID';" 2>/dev/null)
          if [ -n "$OLD_IDS" ]; then
            echo "⚠️ Found stale project entries for same worktree. Migrating..."
            for OLD in $OLD_IDS; do
              echo "  Migrating sessions: $OLD -> $CURRENT_ID"
              sqlite3 "$DB" "UPDATE session SET project_id='$CURRENT_ID' WHERE project_id='$OLD';"
              sqlite3 "$DB" "DELETE FROM project WHERE id='$OLD';"
            done
            echo "✅ Migration complete."
          else
            echo "✅ No stale projects to migrate."
          fi

      # =======================================================================
      # 9) Cloudflare Tunnel
      # =======================================================================
      - name: 🌐 Start Cloudflare Quick Tunnel
        id: tunnel
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cloudflared-logs"
          TUN_LOG="$RUNNER_TEMP/cloudflared-logs/tunnel.log"
          : > "$TUN_LOG"

          setsid bash -c "cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4096 </dev/null >>'$TUN_LOG' 2>&1" &
          TUN_PID=$!
          disown || true
          echo "$TUN_PID" > "$RUNNER_TEMP/cloudflared.pid"

          PUBLIC_URL=""
          for i in $(seq 1 90); do
            if grep -Eo 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' "$TUN_LOG" | head -n1 > /tmp/url.txt 2>/dev/null; then
              PUBLIC_URL=$(cat /tmp/url.txt || true)
              if [ -n "$PUBLIC_URL" ]; then break; fi
            fi
            if ! kill -0 "$TUN_PID" 2>/dev/null; then
              echo "❌ cloudflared exited. Logs:"
              cat "$TUN_LOG"; exit 1
            fi
            sleep 1
          done

          if [ -z "$PUBLIC_URL" ]; then
            echo "❌ No tunnel URL in 90s."
            cat "$TUN_LOG"; exit 1
          fi

          echo "PUBLIC_URL=$PUBLIC_URL" >> "$GITHUB_ENV"
          echo "public_url=$PUBLIC_URL" >> "$GITHUB_OUTPUT"

          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║              🎉 OpenCode AI is LIVE on the Web 🎉              ║"
          echo "╠════════════════════════════════════════════════════════════════╣"
          printf  "║  URL:  %-55s ║\n" "$PUBLIC_URL"
          printf  "║  Project ID: %-49s ║\n" "$OPENCODE_PROJECT_ID"
          echo "╚════════════════════════════════════════════════════════════════╝"

      # =======================================================================
      # 10) Summary
      # =======================================================================
      - name: 📌 Publish URL to Job Summary
        run: |
          {
            echo "# 🤖 OpenCode AI — Live Session"
            echo ""
            echo "## 🌐 الرابط العام"
            echo "### 👉 [${PUBLIC_URL}](${PUBLIC_URL})"
            echo ""
            echo "| الحقل | القيمة |"
            echo "|------|--------|"
            echo "| **Repository** | \`${GITHUB_REPOSITORY}\` |"
            echo "| **Branch** | \`${GITHUB_REF_NAME}\` |"
            echo "| **Project ID** | \`${OPENCODE_PROJECT_ID}\` |"
            echo "| **Working Dir** | \`${GITHUB_WORKSPACE}\` |"
            echo "| **مدة التشغيل** | ${{ github.event.inputs.duration_minutes }} دقيقة |"
          } >> "$GITHUB_STEP_SUMMARY"

      # =======================================================================
      # 11) Auto-commit loop
      # =======================================================================
      - name: 🔁 Start auto-commit loop (background)
        if: ${{ github.event.inputs.auto_commit == 'true' }}
        timeout-minutes: 1
        run: |
          set -euo pipefail
          git config --global user.email "opencode-bot@users.noreply.github.com"
          git config --global user.name  "opencode-bot"

          INTERVAL="${{ github.event.inputs.commit_interval_seconds }}"
          BRANCH="${GITHUB_REF_NAME}"
          LOG="$RUNNER_TEMP/autocommit.log"
          : > "$LOG"

          cat > "$RUNNER_TEMP/autocommit.sh" <<EOF
          #!/usr/bin/env bash
          cd "$GITHUB_WORKSPACE"
          while true; do
            sleep $INTERVAL
            if [ -n "\$(git status --porcelain)" ]; then
              git add -A
              MSG="🤖 opencode: auto-commit \$(date -u +'%Y-%m-%d %H:%M:%SZ')"
              git commit -m "\$MSG" >> "$LOG" 2>&1 || true
              git push origin "$BRANCH" >> "$LOG" 2>&1 || true
            fi
          done
          EOF
          chmod +x "$RUNNER_TEMP/autocommit.sh"

          setsid bash -c "bash '$RUNNER_TEMP/autocommit.sh' </dev/null >>'$LOG' 2>&1" &
          AC_PID=$!
          disown || true
          echo "$AC_PID" > "$RUNNER_TEMP/autocommit.pid"
          echo "✅ Auto-commit loop (PID=$AC_PID, every ${INTERVAL}s)"

      # =======================================================================
      # 12) Keep alive
      # =======================================================================
      - name: ⏳ Keep session alive
        run: |
          DURATION_MIN="${{ github.event.inputs.duration_minutes }}"
          DURATION_SEC=$(( DURATION_MIN * 60 ))
          echo "Session for ${DURATION_MIN} minutes."

          ELAPSED=0
          STEP=300
          while [ "$ELAPSED" -lt "$DURATION_SEC" ]; do
            sleep "$STEP"
            ELAPSED=$(( ELAPSED + STEP ))
            REMAIN=$(( (DURATION_SEC - ELAPSED) / 60 ))
            echo "⏱️ elapsed=$((ELAPSED/60))min  remaining=${REMAIN}min  🌐 ${PUBLIC_URL}"

            if [ -f "$RUNNER_TEMP/opencode.pid" ] && ! kill -0 "$(cat $RUNNER_TEMP/opencode.pid)" 2>/dev/null; then
              echo "⚠️ opencode died"; exit 1
            fi
            if [ -f "$RUNNER_TEMP/cloudflared.pid" ] && ! kill -0 "$(cat $RUNNER_TEMP/cloudflared.pid)" 2>/dev/null; then
              echo "⚠️ cloudflared died"; exit 1
            fi
          done

      # =======================================================================
      # 13) Final commit
      # =======================================================================
      - name: 💾 Final commit & push
        if: ${{ always() && github.event.inputs.auto_commit == 'true' }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git config --global user.email "opencode-bot@users.noreply.github.com"
          git config --global user.name  "opencode-bot"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "🤖 opencode: final $(date -u +'%Y-%m-%d %H:%M:%SZ')" || true
            git push origin "${GITHUB_REF_NAME}" || true
          fi

      # =======================================================================
      # 14) Debug logs
      # =======================================================================
      - name: 📜 Show logs (debug)
        if: ${{ always() }}
        run: |
          echo "===== opencode server log ====="
          tail -n 150 "$RUNNER_TEMP/opencode-logs/server.log" 2>/dev/null || true
          echo ""
          echo "===== DB projects & sessions ====="
          DB="$HOME/.local/share/opencode/opencode.db"
          if [ -f "$DB" ]; then
            sqlite3 "$DB" "SELECT id, worktree FROM project;" 2>/dev/null || true
            echo "---"
            sqlite3 "$DB" "SELECT id, project_id, title FROM session LIMIT 20;" 2>/dev/null || true
          fi
          echo ""
          echo "===== cloudflared log ====="
          tail -n 40 "$RUNNER_TEMP/cloudflared-logs/tunnel.log" 2>/dev/null || true

      - name: 🧹 Shutdown cloudflared
        if: ${{ always() }}
        uses: AnimMouse/setup-cloudflared/shutdown@v2
