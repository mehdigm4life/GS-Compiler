name: 🤖 OpenCode AI Cloud (Web) + Sessions Backup

# يعمل هذا الـ workflow على أي repository تضع فيه هذا الملف
# المسار المطلوب: .github/workflows/opencode.yml
#
# ميزات هذا الإصدار المُطوّر:
#   1) Restore تلقائي للجلسات (sessions/messages) قبل تشغيل opencode
#      حتى يتذكر الـ agent كل المحادثات والخطط السابقة بعد off/on.
#   2) Backup فوري Real-Time لأي رسالة (request/response) عبر inotifywait
#      + Backup دوري كـ fallback، يتم push مباشرة إلى الـ branch الحالي.
#   3) Backup نظيف نهائي عند توقف الـ workflow (يدوياً أو بعد 6 ساعات).
#   4) AGENTS.md يُحفظ تلقائياً ليبقى الـ context الخاص بالمشروع محفوظاً
#      حتى لو فُقدت الجلسات (طبقة حماية إضافية).
#   5) إصلاح مشكلة الـ "thinking…" / الحاجة لـ refresh عبر reverse-proxy
#      صغير بـ Node.js يفرض headers تمنع الـ buffering ويُمرّر SSE فوراً.

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "كم دقيقة يبقى السيرفر شغّال (الحد الأقصى = 350 دقيقة ≈ 6 ساعات)"
        required: true
        default: "350"
        type: string
      auto_commit:
        description: "هل تريد commit + push تلقائي لأي تعديلات يقوم بها opencode على ملفات المشروع؟"
        required: true
        default: true
        type: boolean
      commit_interval_seconds:
        description: "كل كم ثانية يتم فحص تغييرات ملفات المشروع وعمل commit (افتراضي 60 ثانية)"
        required: true
        default: "60"
        type: string
      backup_branch:
        description: "اسم الـ branch الذي تُحفظ فيه الـ backups (اتركه فارغاً ليستخدم نفس الـ branch الحالي)"
        required: false
        default: ""
        type: string
      backup_interval_seconds:
        description: "كل كم ثانية يتم رفع backup للـ sessions كـ fallback (افتراضي 15 ثانية)"
        required: true
        default: "15"
        type: string

# نحتاج صلاحية الكتابة لعمل push
permissions:
  contents: write

jobs:
  opencode-web:
    name: 🚀 Run OpenCode Web + Cloudflare Tunnel + Sessions Backup
    runs-on: ubuntu-latest
    timeout-minutes: 355

    env:
      # ===== مزودات النماذج الشائعة (كلها اختيارية) =====
      OPENCODE_API_KEY:    ${{ secrets.OPENCODE_API_KEY }}
      ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
      DEEPSEEK_API_KEY:    ${{ secrets.DEEPSEEK_API_KEY }}
      MISTRAL_API_KEY:     ${{ secrets.MISTRAL_API_KEY }}
      XAI_API_KEY:         ${{ secrets.XAI_API_KEY }}
      COHERE_API_KEY:      ${{ secrets.COHERE_API_KEY }}
      TOGETHER_API_KEY:    ${{ secrets.TOGETHER_API_KEY }}
      PERPLEXITY_API_KEY:  ${{ secrets.PERPLEXITY_API_KEY }}

      # ===== مسارات الـ backup =====
      # مجلد الـ backup داخل الـ repo (سيتم رفعه على GitHub في الـ branch المحدد)
      BACKUP_DIR_REL: ".opencode-backups"
      # مسارات الـ data الفعلية لـ opencode على الـ runner
      # opencode v0.6+ يستخدم XDG_DATA_HOME → ~/.local/share/opencode
      # الإصدارات الأقدم تستخدم ~/.opencode، لذا نأخذهما معاً
      OPENCODE_DATA_DIR:   "/home/runner/.local/share/opencode"
      OPENCODE_CONFIG_DIR: "/home/runner/.config/opencode"
      OPENCODE_LEGACY_DIR: "/home/runner/.opencode"

    steps:
      # -----------------------------------------------------------------------
      # 1) جلب كود الـ repository الحالي (كل الـ history لضمان push نظيف)
      # -----------------------------------------------------------------------
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # 2) تحديد الـ branch المستخدم للـ backup
      # -----------------------------------------------------------------------
      - name: 🌿 Resolve backup branch
        id: resolve_branch
        run: |
          INPUT_BR="${{ github.event.inputs.backup_branch }}"
          if [ -z "$INPUT_BR" ]; then
            BACKUP_BR="${GITHUB_REF_NAME}"
          else
            BACKUP_BR="$INPUT_BR"
          fi
          echo "BACKUP_BRANCH=$BACKUP_BR" >> "$GITHUB_ENV"
          echo "branch=$BACKUP_BR" >> "$GITHUB_OUTPUT"
          echo "✅ Backup branch = $BACKUP_BR"

      # -----------------------------------------------------------------------
      # 3) Setup Node.js (لـ opencode + proxy)
      # -----------------------------------------------------------------------
      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # -----------------------------------------------------------------------
      # 4) تثبيت أدوات النظام (+ inotify-tools للـ real-time backup + rsync)
      # -----------------------------------------------------------------------
      - name: 🛠️ Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            curl unzip jq git ca-certificates procps \
            inotify-tools rsync coreutils

      # -----------------------------------------------------------------------
      # 5) ⭐ RESTORE — استرجاع آخر backup للجلسات قبل تشغيل opencode
      #    إذا وُجد مجلد .opencode-backups في الـ repo، يتم نسخه إلى
      #    المسارات الفعلية للـ opencode حتى يتذكر كل المحادثات والخطط.
      # -----------------------------------------------------------------------
      - name: ♻️ Restore previous sessions (if backup exists)
        run: |
          set -euo pipefail
          BK="${GITHUB_WORKSPACE}/${BACKUP_DIR_REL}"

          mkdir -p "$OPENCODE_DATA_DIR" "$OPENCODE_CONFIG_DIR" "$OPENCODE_LEGACY_DIR"

          if [ -d "$BK" ]; then
            echo "📦 Found backup directory: $BK"
            ls -la "$BK" || true

            if [ -d "$BK/data" ]; then
              echo "→ Restoring data → $OPENCODE_DATA_DIR"
              rsync -a --delete "$BK/data/" "$OPENCODE_DATA_DIR/" || true
            fi
            if [ -d "$BK/config" ]; then
              echo "→ Restoring config → $OPENCODE_CONFIG_DIR"
              rsync -a --delete "$BK/config/" "$OPENCODE_CONFIG_DIR/" || true
            fi
            if [ -d "$BK/legacy" ]; then
              echo "→ Restoring legacy → $OPENCODE_LEGACY_DIR"
              rsync -a --delete "$BK/legacy/" "$OPENCODE_LEGACY_DIR/" || true
            fi
            echo "✅ Restore done."
          else
            echo "ℹ️ No previous backup found at $BK — starting fresh."
          fi

          # عرض حجم البيانات بعد الـ restore
          du -sh "$OPENCODE_DATA_DIR" "$OPENCODE_CONFIG_DIR" "$OPENCODE_LEGACY_DIR" 2>/dev/null || true

      # -----------------------------------------------------------------------
      # 6) تثبيت OpenCode عبر الطريقة الرسمية + npm fallback
      # -----------------------------------------------------------------------
      - name: 🤖 Install OpenCode AI
        run: |
          set -e
          echo "::group::Installing opencode via official installer"
          curl -fsSL https://opencode.ai/install | bash
          echo "::endgroup::"

          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.opencode/bin:$PATH"

          echo "::group::Installing opencode-ai via npm (fallback)"
          npm install -g opencode-ai || true
          echo "::endgroup::"

          which opencode || true
          opencode --version || true

      # -----------------------------------------------------------------------
      # 7) تثبيت cloudflared
      # -----------------------------------------------------------------------
      - name: ☁️ Install cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: ✅ Verify cloudflared
        run: cloudflared --version

      # -----------------------------------------------------------------------
      # 8) إنشاء opencode.json + AGENTS.md للسياق الدائم
      # -----------------------------------------------------------------------
      - name: 📝 Prepare opencode config & persistent context
        run: |
          set -euo pipefail
          if [ ! -f "opencode.json" ] && [ ! -f ".opencode/opencode.json" ]; then
            cat > opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "theme": "opencode",
            "autoshare": false,
            "autoupdate": false
          }
          JSON
            echo "Created default opencode.json"
          else
            echo "Using existing opencode config"
          fi

          # AGENTS.md = طبقة حماية إضافية للسياق
          # opencode يقرأ هذا الملف تلقائياً في بداية كل جلسة جديدة
          if [ ! -f "AGENTS.md" ]; then
            cat > AGENTS.md <<'MD'
          # Project Context (auto-managed by OpenCode workflow)

          This file is auto-loaded by opencode at the start of every session.
          Use it to keep persistent context about the project so that even if
          a session is lost, the agent immediately knows:

          - What this repository is about
          - Tech stack and key folders
          - Coding style / conventions
          - The current high-level plan / TODOs

          > You (or the agent) can freely edit this file. It will be committed
          > and pushed automatically along with every session backup.

          ## Repository
          - Repo: see `git remote -v`
          - Branch used by this workflow: stored at runtime

          ## Plan / TODO
          - (Add the current project plan here so the agent always remembers it.)

          ## Notes
          - Conversations and sessions are auto-backed-up in `.opencode-backups/`
            and restored on every workflow start.
          MD
            echo "Created default AGENTS.md"
          fi

      # -----------------------------------------------------------------------
      # 9) ⭐ تشغيل opencode serve في الخلفية (مع الإصلاح الأصلي)
      # -----------------------------------------------------------------------
      - name: 🚀 Start OpenCode web server (background)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          export PATH="$HOME/.opencode/bin:$PATH"

          mkdir -p "$RUNNER_TEMP/opencode-logs"
          LOG_FILE="$RUNNER_TEMP/opencode-logs/server.log"
          : > "$LOG_FILE"

          echo "Starting opencode serve on 127.0.0.1:4096 ..."

          # setsid + disown + إعادة توجيه stdin/stdout/stderr لمنع تعليق الـ step
          # نُشغّله على 127.0.0.1 فقط — الـ proxy في الخطوة التالية يكشفه للخارج
          setsid bash -c "opencode serve --hostname 127.0.0.1 --port 4096 </dev/null >>'$LOG_FILE' 2>&1" &
          OPENCODE_PID=$!
          disown || true

          echo "$OPENCODE_PID" > "$RUNNER_TEMP/opencode.pid"
          echo "OpenCode PID = $OPENCODE_PID"

          UP=0
          for i in $(seq 1 120); do
            if curl -fsS --max-time 2 http://127.0.0.1:4096/global/health >/dev/null 2>&1; then
              UP=1; echo "✅ /global/health responded after ${i}s"; break
            fi
            if (echo > /dev/tcp/127.0.0.1/4096) >/dev/null 2>&1; then
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 2 http://127.0.0.1:4096/ || echo "000")
              if [ "$CODE" != "000" ]; then
                UP=1; echo "✅ opencode listening on :4096 (HTTP $CODE) after ${i}s"; break
              fi
            fi
            if ! kill -0 "$OPENCODE_PID" 2>/dev/null; then
              echo "❌ opencode process exited prematurely. Logs:"
              cat "$LOG_FILE" || true
              exit 1
            fi
            sleep 1
          done

          if [ "$UP" -ne 1 ]; then
            echo "❌ opencode failed to become reachable in 120s. Logs:"
            tail -n 200 "$LOG_FILE" || true
            kill -TERM "$OPENCODE_PID" 2>/dev/null || true
            exit 1
          fi

          tail -n 30 "$LOG_FILE" || true

      # -----------------------------------------------------------------------
      # 10) ⭐ إصلاح مشكلة "thinking…" / refresh —
      #     reverse proxy صغير بـ Node.js يُمرّر كل شيء فوراً بدون buffering،
      #     ويضيف headers تمنع أي وسيط (Cloudflare/Browsers) من تأخير SSE.
      # -----------------------------------------------------------------------
      - name: 🔁 Start SSE-safe reverse proxy on :4097
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proxy"
          PROXY_LOG="$RUNNER_TEMP/proxy/proxy.log"
          : > "$PROXY_LOG"

          cat > "$RUNNER_TEMP/proxy/proxy.js" <<'NODE'
          // Tiny zero-dependency reverse proxy to fix SSE/streaming buffering
          // when exposing opencode via Cloudflare Quick Tunnel.
          const http = require('http');
          const net  = require('net');

          const UPSTREAM_HOST = '127.0.0.1';
          const UPSTREAM_PORT = 4096;
          const LISTEN_PORT   = 4097;

          // Headers we INJECT into every response to force real-time streaming
          const NO_BUFFER_HEADERS = {
            'cache-control': 'no-cache, no-transform',
            'x-accel-buffering': 'no',          // disables nginx/CF buffering
            'pragma': 'no-cache',
          };

          const server = http.createServer((clientReq, clientRes) => {
            // Disable Nagle on client socket so writes flush immediately
            try { clientReq.socket.setNoDelay(true); } catch (_) {}

            const headers = { ...clientReq.headers };
            // Make sure we don't accept compression upstream
            // (compressed streams get buffered by Cloudflare on SSE).
            headers['accept-encoding'] = 'identity';

            const proxyReq = http.request({
              host:    UPSTREAM_HOST,
              port:    UPSTREAM_PORT,
              method:  clientReq.method,
              path:    clientReq.url,
              headers: headers,
            }, (proxyRes) => {
              // Inject anti-buffering headers
              const outHeaders = { ...proxyRes.headers, ...NO_BUFFER_HEADERS };

              // Remove anything that may cause buffering/compression downstream
              delete outHeaders['content-encoding'];
              delete outHeaders['content-length'];

              // CORS — fully open like the original --cors '*'
              outHeaders['access-control-allow-origin']      = '*';
              outHeaders['access-control-allow-methods']     = '*';
              outHeaders['access-control-allow-headers']     = '*';
              outHeaders['access-control-expose-headers']    = '*';

              clientRes.writeHead(proxyRes.statusCode || 502, outHeaders);

              // Force flush each chunk
              proxyRes.on('data', (chunk) => {
                clientRes.write(chunk);
                if (typeof clientRes.flush === 'function') clientRes.flush();
              });
              proxyRes.on('end',   () => clientRes.end());
              proxyRes.on('error', (e) => { try { clientRes.end(); } catch(_){} });
            });

            proxyReq.on('error', (err) => {
              try {
                clientRes.writeHead(502, { 'content-type': 'text/plain' });
                clientRes.end('Upstream error: ' + err.message);
              } catch (_) {}
            });

            clientReq.pipe(proxyReq);
          });

          // Handle CONNECT (HTTPS tunneling) — not really needed but safe
          server.on('connect', (req, clientSocket, head) => {
            const [host, port] = (req.url || '').split(':');
            const srvSocket = net.connect(parseInt(port || '443', 10), host, () => {
              clientSocket.write('HTTP/1.1 200 Connection Established\r\n\r\n');
              srvSocket.write(head);
              srvSocket.pipe(clientSocket);
              clientSocket.pipe(srvSocket);
            });
            srvSocket.on('error', () => { try { clientSocket.end(); } catch(_){} });
          });

          // Disable response buffering at TCP level for every new connection
          server.on('connection', (sock) => { try { sock.setNoDelay(true); } catch(_){} });

          server.keepAliveTimeout = 0;
          server.headersTimeout   = 0;
          server.requestTimeout   = 0;

          server.listen(LISTEN_PORT, '0.0.0.0', () => {
            console.log('SSE-safe proxy listening on :' + LISTEN_PORT + ' → ' + UPSTREAM_HOST + ':' + UPSTREAM_PORT);
          });
          NODE

          setsid bash -c "node '$RUNNER_TEMP/proxy/proxy.js' </dev/null >>'$PROXY_LOG' 2>&1" &
          PROXY_PID=$!
          disown || true
          echo "$PROXY_PID" > "$RUNNER_TEMP/proxy.pid"
          echo "Proxy PID = $PROXY_PID"

          # ننتظر حتى يستجيب الـ proxy
          UP=0
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/4097) >/dev/null 2>&1; then
              UP=1
              echo "✅ proxy listening on :4097 after ${i}s"
              break
            fi
            if ! kill -0 "$PROXY_PID" 2>/dev/null; then
              echo "❌ proxy process exited. Logs:"
              cat "$PROXY_LOG" || true
              exit 1
            fi
            sleep 1
          done
          if [ "$UP" -ne 1 ]; then
            echo "❌ proxy never came up. Logs:"
            cat "$PROXY_LOG" || true
            exit 1
          fi

      # -----------------------------------------------------------------------
      # 11) فتح Cloudflare Quick Tunnel على الـ proxy (:4097) لا على opencode مباشرة
      # -----------------------------------------------------------------------
      - name: 🌐 Start Cloudflare Quick Tunnel
        id: tunnel
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cloudflared-logs"
          TUN_LOG="$RUNNER_TEMP/cloudflared-logs/tunnel.log"
          : > "$TUN_LOG"

          # نوجّه cloudflared إلى الـ proxy على 4097 لإصلاح SSE
          setsid bash -c "cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4097 </dev/null >>'$TUN_LOG' 2>&1" &
          TUN_PID=$!
          disown || true
          echo "$TUN_PID" > "$RUNNER_TEMP/cloudflared.pid"
          echo "cloudflared PID = $TUN_PID"

          PUBLIC_URL=""
          for i in $(seq 1 90); do
            if grep -Eo 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' "$TUN_LOG" | head -n1 > /tmp/url.txt 2>/dev/null; then
              PUBLIC_URL=$(cat /tmp/url.txt || true)
              if [ -n "$PUBLIC_URL" ]; then break; fi
            fi
            if ! kill -0 "$TUN_PID" 2>/dev/null; then
              echo "❌ cloudflared exited prematurely. Logs:"
              cat "$TUN_LOG" || true
              exit 1
            fi
            sleep 1
          done

          if [ -z "$PUBLIC_URL" ]; then
            echo "❌ Failed to get tunnel URL in 90s."
            cat "$TUN_LOG"
            exit 1
          fi

          echo "PUBLIC_URL=$PUBLIC_URL" >> "$GITHUB_ENV"
          echo "public_url=$PUBLIC_URL" >> "$GITHUB_OUTPUT"

          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║          🎉 OpenCode AI is LIVE (SSE-safe + Backup) 🎉         ║"
          echo "╠════════════════════════════════════════════════════════════════╣"
          printf  "║  URL:    %-53s ║\n" "$PUBLIC_URL"
          printf  "║  Health: %-53s ║\n" "$PUBLIC_URL/global/health"
          printf  "║  Branch: %-53s ║\n" "$BACKUP_BRANCH"
          echo "╚════════════════════════════════════════════════════════════════╝"

      # -----------------------------------------------------------------------
      # 12) نشر الرابط في Job Summary
      # -----------------------------------------------------------------------
      - name: 📌 Publish URL to Job Summary
        run: |
          {
            echo "# 🤖 OpenCode AI — Live Session (with Persistent Memory)"
            echo ""
            echo "## 🌐 الرابط العام"
            echo ""
            echo "### 👉 [${PUBLIC_URL}](${PUBLIC_URL})"
            echo ""
            echo "- Health check: \`${PUBLIC_URL}/global/health\`"
            echo "- API docs:     \`${PUBLIC_URL}/doc\`"
            echo ""
            echo "| الحقل | القيمة |"
            echo "|------|--------|"
            echo "| **Repository** | \`${GITHUB_REPOSITORY}\` |"
            echo "| **Current branch** | \`${GITHUB_REF_NAME}\` |"
            echo "| **Backup branch** | \`${BACKUP_BRANCH}\` |"
            echo "| **مدة التشغيل** | ${{ github.event.inputs.duration_minutes }} دقيقة |"
            echo "| **Auto commit (ملفات المشروع)** | ${{ github.event.inputs.auto_commit }} |"
            echo "| **Project commit interval** | ${{ github.event.inputs.commit_interval_seconds }} ثانية |"
            echo "| **Sessions backup interval (fallback)** | ${{ github.event.inputs.backup_interval_seconds }} ثانية |"
            echo "| **Sessions backup mode** | Real-time (inotifywait) + Periodic + Final |"
            echo ""
            echo "## 💾 الذاكرة الدائمة"
            echo "- يتم رفع backup كامل للجلسات/الرسائل على \`${BACKUP_BRANCH}\` داخل مجلد \`.opencode-backups/\`."
            echo "- عند تشغيل الـ workflow مرة أخرى، يتم استرجاع آخر backup تلقائياً قبل تشغيل opencode."
            echo "- ملف \`AGENTS.md\` يحفظ الخطة العامة للمشروع (طبقة حماية إضافية)."
            echo ""
            echo "## 🛑 لإيقاف الجلسة"
            echo "اضغط على **Cancel workflow** — سيتم رفع backup نهائي قبل الخروج."
          } >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      # 13) Auto-commit loop لملفات المشروع (اختياري)
      # -----------------------------------------------------------------------
      - name: 🔁 Start auto-commit loop for project files (background)
        if: ${{ github.event.inputs.auto_commit == 'true' }}
        timeout-minutes: 1
        run: |
          set -euo pipefail
          git config --global user.email "opencode-bot@users.noreply.github.com"
          git config --global user.name  "opencode-bot"

          INTERVAL="${{ github.event.inputs.commit_interval_seconds }}"
          BRANCH="${BACKUP_BRANCH}"
          LOG="$RUNNER_TEMP/autocommit.log"
          : > "$LOG"

          cat > "$RUNNER_TEMP/autocommit.sh" <<EOF
          #!/usr/bin/env bash
          cd "$GITHUB_WORKSPACE"
          while true; do
            sleep $INTERVAL
            # نستثني مجلد الـ backup حتى لا يتداخل مع الـ sessions-backup loop
            if [ -n "\$(git -c status.showUntrackedFiles=normal status --porcelain -- ':(exclude)${BACKUP_DIR_REL}' '.' )" ]; then
              git add -A -- ':(exclude)${BACKUP_DIR_REL}' '.'
              MSG="🤖 opencode: project auto-commit \$(date -u +'%Y-%m-%d %H:%M:%SZ')"
              git commit -m "\$MSG" >> "$LOG" 2>&1 || true
              # pull --rebase لتفادي تعارض مع backup commits
              git pull --rebase origin "$BRANCH" >> "$LOG" 2>&1 || true
              git push origin "HEAD:$BRANCH" >> "$LOG" 2>&1 || true
              echo "[\$(date -u)] pushed: \$MSG" >> "$LOG"
            fi
          done
          EOF
          chmod +x "$RUNNER_TEMP/autocommit.sh"

          setsid bash -c "bash '$RUNNER_TEMP/autocommit.sh' </dev/null >>'$LOG' 2>&1" &
          AC_PID=$!
          disown || true
          echo "$AC_PID" > "$RUNNER_TEMP/autocommit.pid"
          echo "✅ Project auto-commit started (PID=$AC_PID, every ${INTERVAL}s)"

      # -----------------------------------------------------------------------
      # 14) ⭐ Sessions Real-Time Backup Loop
      #     - inotifywait يلتقط أي تغيير فوراً (رسالة جديدة / رد جديد)
      #     - عند أي حدث يقوم بـ rsync + commit + push مباشرة على الـ branch
      #     - يوجد debounce لتجميع التغييرات المتتالية وتجنب طوفان الـ commits
      # -----------------------------------------------------------------------
      - name: 💾 Start REAL-TIME sessions backup loop (background)
        timeout-minutes: 1
        run: |
          set -euo pipefail
          git config --global user.email "opencode-bot@users.noreply.github.com"
          git config --global user.name  "opencode-bot"

          BR="${BACKUP_BRANCH}"
          BACKUP_LOG="$RUNNER_TEMP/sessions-backup.log"
          : > "$BACKUP_LOG"

          # نضمن وجود المجلد قبل بدء المراقبة (inotifywait يحتاج وجوده)
          mkdir -p "$OPENCODE_DATA_DIR" "$OPENCODE_CONFIG_DIR" "$OPENCODE_LEGACY_DIR"

          cat > "$RUNNER_TEMP/sessions-backup.sh" <<EOF
          #!/usr/bin/env bash
          set -uo pipefail
          BK="\$GITHUB_WORKSPACE/${BACKUP_DIR_REL}"
          mkdir -p "\$BK/data" "\$BK/config" "\$BK/legacy"

          do_sync_and_push() {
            # rsync من المسارات الحقيقية إلى مجلد الـ backup في الـ repo
            rsync -a --delete --inplace \\
              "${OPENCODE_DATA_DIR}/"   "\$BK/data/"   2>>"$BACKUP_LOG" || true
            rsync -a --delete --inplace \\
              "${OPENCODE_CONFIG_DIR}/" "\$BK/config/" 2>>"$BACKUP_LOG" || true
            rsync -a --delete --inplace \\
              "${OPENCODE_LEGACY_DIR}/" "\$BK/legacy/" 2>>"$BACKUP_LOG" || true

            # نسجل metadata بسيط
            {
              echo "last_backup_utc: \$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              echo "data_size:   \$(du -sh "${OPENCODE_DATA_DIR}"   2>/dev/null | awk '{print \$1}')"
              echo "config_size: \$(du -sh "${OPENCODE_CONFIG_DIR}" 2>/dev/null | awk '{print \$1}')"
              echo "legacy_size: \$(du -sh "${OPENCODE_LEGACY_DIR}" 2>/dev/null | awk '{print \$1}')"
            } > "\$BK/LAST_BACKUP.txt"

            cd "\$GITHUB_WORKSPACE"
            if [ -n "\$(git status --porcelain -- "${BACKUP_DIR_REL}")" ]; then
              git add -- "${BACKUP_DIR_REL}" AGENTS.md 2>/dev/null || git add -- "${BACKUP_DIR_REL}"
              MSG="💾 sessions-backup \$(date -u +'%Y-%m-%d %H:%M:%SZ')"
              if git commit -m "\$MSG" >>"$BACKUP_LOG" 2>&1; then
                # pull --rebase لتفادي تعارض مع project-commits
                git pull --rebase origin "$BR" >>"$BACKUP_LOG" 2>&1 || true
                git push origin "HEAD:$BR" >>"$BACKUP_LOG" 2>&1 || true
                echo "[\$(date -u)] backup pushed: \$MSG" >>"$BACKUP_LOG"
              fi
            fi
          }

          # تأكد من تتبع الـ branch بشكل صحيح
          cd "\$GITHUB_WORKSPACE"
          git fetch origin "$BR" >>"$BACKUP_LOG" 2>&1 || true

          DEBOUNCE=3   # ننتظر 3 ثوانٍ بعد آخر حدث ثم نعمل push (تجميع الكتابات)
          LAST_EVENT_TS=0

          # الحلقة الرئيسية: inotifywait بشكل غير حاجز
          (
            inotifywait -mrq -e modify,create,delete,move,close_write \\
              --format '%T %w%f %e' --timefmt '%s' \\
              "${OPENCODE_DATA_DIR}" "${OPENCODE_CONFIG_DIR}" "${OPENCODE_LEGACY_DIR}" \\
              2>>"$BACKUP_LOG" | while read -r ts path ev; do
                echo "\$ts" > "$RUNNER_TEMP/last_event_ts"
            done
          ) &
          INOTIFY_PID=\$!
          echo "\$INOTIFY_PID" > "$RUNNER_TEMP/inotify.pid"

          # حلقة المعالجة: تقرأ آخر event وتعمل sync+push عند انقضاء الـ debounce
          PERIODIC_FALLBACK="${{ github.event.inputs.backup_interval_seconds }}"
          LAST_PERIODIC=\$(date +%s)
          LAST_PUSHED_TS=0
          while true; do
            sleep 2
            NOW=\$(date +%s)
            EV_TS=0
            if [ -f "$RUNNER_TEMP/last_event_ts" ]; then
              EV_TS=\$(cat "$RUNNER_TEMP/last_event_ts" 2>/dev/null || echo 0)
            fi

            # real-time push: حدث جديد + انقضى الـ debounce
            if [ "\$EV_TS" -gt "\$LAST_PUSHED_TS" ] && [ \$((NOW - EV_TS)) -ge \$DEBOUNCE ]; then
              do_sync_and_push
              LAST_PUSHED_TS=\$EV_TS
              LAST_PERIODIC=\$NOW
            fi

            # periodic fallback (في حال inotify فاتته أحداث على FS غريب)
            if [ \$((NOW - LAST_PERIODIC)) -ge \$PERIODIC_FALLBACK ]; then
              do_sync_and_push
              LAST_PERIODIC=\$NOW
            fi
          done
          EOF
          chmod +x "$RUNNER_TEMP/sessions-backup.sh"

          setsid bash -c "bash '$RUNNER_TEMP/sessions-backup.sh' </dev/null >>'$BACKUP_LOG' 2>&1" &
          BK_PID=$!
          disown || true
          echo "$BK_PID" > "$RUNNER_TEMP/sessions-backup.pid"
          echo "✅ Real-time sessions backup started (PID=$BK_PID), branch=${BR}"

      # -----------------------------------------------------------------------
      # 15) إبقاء الـ job حياً للمدة المطلوبة
      # -----------------------------------------------------------------------
      - name: ⏳ Keep session alive
        run: |
          DURATION_MIN="${{ github.event.inputs.duration_minutes }}"
          DURATION_SEC=$(( DURATION_MIN * 60 ))
          echo "Session will run for ${DURATION_MIN} minutes (${DURATION_SEC}s)."
          echo "Public URL: ${PUBLIC_URL}"
          echo "Backup branch: ${BACKUP_BRANCH}"
          echo ""

          ELAPSED=0
          STEP=300
          while [ "$ELAPSED" -lt "$DURATION_SEC" ]; do
            sleep "$STEP"
            ELAPSED=$(( ELAPSED + STEP ))
            REMAIN_MIN=$(( (DURATION_SEC - ELAPSED) / 60 ))
            echo "⏱️ Heartbeat — elapsed=$((ELAPSED/60))min  remaining=${REMAIN_MIN}min"
            echo "🌐 ${PUBLIC_URL}"

            for pidfile in opencode.pid cloudflared.pid proxy.pid sessions-backup.pid; do
              if [ -f "$RUNNER_TEMP/$pidfile" ]; then
                PID=$(cat "$RUNNER_TEMP/$pidfile")
                if ! kill -0 "$PID" 2>/dev/null; then
                  echo "⚠️ Process from $pidfile (PID=$PID) died."
                  # opencode و cloudflared حرجين — نخرج. البقية نتسامح معها.
                  case "$pidfile" in
                    opencode.pid|cloudflared.pid) exit 1 ;;
                  esac
                fi
              fi
            done
          done

          echo "✅ Session duration reached. Shutting down."

      # -----------------------------------------------------------------------
      # 16) ⭐ FINAL BACKUP — يضمن رفع آخر نسخة قبل إغلاق الـ workflow
      #     يعمل حتى لو تم إلغاء الـ workflow يدوياً (if: always())
      # -----------------------------------------------------------------------
      - name: 💾 FINAL sessions backup & push
        if: ${{ always() }}
        run: |
          set +e
          echo "=== Performing final sessions backup ==="
          cd "$GITHUB_WORKSPACE"
          git config --global user.email "opencode-bot@users.noreply.github.com"
          git config --global user.name  "opencode-bot"

          BR="${BACKUP_BRANCH:-${GITHUB_REF_NAME}}"
          BK="$GITHUB_WORKSPACE/${BACKUP_DIR_REL}"
          mkdir -p "$BK/data" "$BK/config" "$BK/legacy"

          # نوقف الـ background loops لتفادي تعارض على git index
          for pidfile in sessions-backup.pid autocommit.pid inotify.pid; do
            if [ -f "$RUNNER_TEMP/$pidfile" ]; then
              PID=$(cat "$RUNNER_TEMP/$pidfile")
              kill -TERM "$PID" 2>/dev/null || true
            fi
          done
          # نمهل الـ rsync الجارية ثانية واحدة لتنهي
          sleep 2

          # rsync نهائي
          rsync -a --delete --inplace "${OPENCODE_DATA_DIR}/"   "$BK/data/"   2>/dev/null || true
          rsync -a --delete --inplace "${OPENCODE_CONFIG_DIR}/" "$BK/config/" 2>/dev/null || true
          rsync -a --delete --inplace "${OPENCODE_LEGACY_DIR}/" "$BK/legacy/" 2>/dev/null || true

          {
            echo "last_backup_utc: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "type: FINAL"
            echo "data_size:   $(du -sh "${OPENCODE_DATA_DIR}"   2>/dev/null | awk '{print $1}')"
            echo "config_size: $(du -sh "${OPENCODE_CONFIG_DIR}" 2>/dev/null | awk '{print $1}')"
            echo "legacy_size: $(du -sh "${OPENCODE_LEGACY_DIR}" 2>/dev/null | awk '{print $1}')"
          } > "$BK/LAST_BACKUP.txt"

          # ندمج كل تغييرات ملفات المشروع أيضاً في الـ commit الأخير
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "💾 FINAL sessions+project backup $(date -u +'%Y-%m-%d %H:%M:%SZ')" || true
            for attempt in 1 2 3; do
              git pull --rebase origin "$BR" || true
              if git push origin "HEAD:$BR"; then
                echo "✅ Final backup pushed to $BR (attempt $attempt)"
                break
              fi
              echo "Retry push ($attempt)…"
              sleep 3
            done
          else
            echo "No changes for final backup."
          fi

      # -----------------------------------------------------------------------
      # 17) عرض اللوجات للتشخيص
      # -----------------------------------------------------------------------
      - name: 📜 Show logs (debug)
        if: ${{ always() }}
        run: |
          echo "===== opencode server log (tail 80) ====="
          tail -n 80 "$RUNNER_TEMP/opencode-logs/server.log" 2>/dev/null || true
          echo ""
          echo "===== proxy log (tail 40) ====="
          tail -n 40 "$RUNNER_TEMP/proxy/proxy.log" 2>/dev/null || true
          echo ""
          echo "===== cloudflared tunnel log (tail 40) ====="
          tail -n 40 "$RUNNER_TEMP/cloudflared-logs/tunnel.log" 2>/dev/null || true
          echo ""
          echo "===== project auto-commit log (tail 40) ====="
          tail -n 40 "$RUNNER_TEMP/autocommit.log" 2>/dev/null || true
          echo ""
          echo "===== sessions backup log (tail 60) ====="
          tail -n 60 "$RUNNER_TEMP/sessions-backup.log" 2>/dev/null || true

      # -----------------------------------------------------------------------
      # 18) إغلاق نظيف للـ cloudflared
      # -----------------------------------------------------------------------
      - name: 🧹 Shutdown cloudflared
        if: ${{ always() }}
        uses: AnimMouse/setup-cloudflared/shutdown@v2
